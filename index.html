<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stryker Bestellen Smart</title>
</head>

<body>

  <h1>Stryker Bestellen Smart</h1>

  <p id="status">Artikelstamm wird geladen...</p>

  <p>
    <strong>VAN:</strong>
    <input
      type="text"
      id="van"
      placeholder="z.B. VAN16"
      autocomplete="off"
      style="width:100px;"
    >
    <button onclick="vanSpeichern()">Speichern</button>
    <span id="vanStatus"></span>
  </p>

  <hr>

  <input
    type="text"
    id="suche"
    placeholder="Artikelnummer oder Barcode"
    autocomplete="off"
  >

  <button onclick="artikelSuchen()">Suchen</button>

  <div id="ergebnis"></div>

  <hr>

  <h2>Bestellung</h2>

  <div id="bestellliste">
    Noch keine Artikel in der Bestellung.
  </div>

  <p>
    <button onclick="bestellungVorbereiten()">
      Bestellung vorbereiten
    </button>
  </p>

  <div id="mailVorschau"></div>


  <script>

    const API_URL =
      'https://script.google.com/macros/s/AKfycbx9oXcfdmay6RtCI22A18t2TNGghcccYvSlBJ5pu0_E5E2jfSknkWMBqQAUFEhkm3Pv-w/exec';

    const BESTELLUNG_SPEICHER =
      'strykerBestellenSmart_bestellung';

    const VAN_SPEICHER =
      'strykerBestellenSmart_van';

    const TEST_EMPFAENGER =
      'ukki62@gmail.com';

    let artikelstamm = [];
    let unbekannterBarcode = '';
    let aktuellerArtikel = null;
    let bestellung = [];


    /*
     * =====================================================
     * VAN
     * =====================================================
     */

    function vanLaden() {

      const van =
        localStorage.getItem(VAN_SPEICHER);

      if (van) {

        document.getElementById('van').value = van;

        document.getElementById('vanStatus').textContent =
          'gespeichert';

      }

    }


    function vanSpeichern() {

      const van = document
        .getElementById('van')
        .value
        .trim();

      if (!van) {

        alert('Bitte VAN eingeben.');
        return;

      }

      localStorage.setItem(
        VAN_SPEICHER,
        van
      );

      document.getElementById('vanStatus').textContent =
        'gespeichert';

    }


    function vanHolen() {

      return localStorage.getItem(VAN_SPEICHER) || '';

    }


    /*
     * =====================================================
     * ARTIKELSTAMM
     * =====================================================
     */

    async function artikelLaden() {

      try {

        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error('HTTP-Fehler: ' + response.status);
        }

        artikelstamm = await response.json();

        document.getElementById('status').textContent =
          artikelstamm.length + ' Datensätze geladen.';

      } catch (fehler) {

        document.getElementById('status').textContent =
          'Fehler beim Laden: ' + fehler.message;

      }

    }


    /*
     * =====================================================
     * BESTELLUNG LADEN / SPEICHERN
     * =====================================================
     */

    function bestellungLaden() {

      try {

        const gespeichert =
          localStorage.getItem(BESTELLUNG_SPEICHER);

        if (gespeichert) {

          const daten = JSON.parse(gespeichert);

          if (Array.isArray(daten)) {
            bestellung = daten;
          }

        }

      } catch (fehler) {

        bestellung = [];

      }

      bestellungAnzeigen();

    }


    function bestellungSpeichern() {

      localStorage.setItem(
        BESTELLUNG_SPEICHER,
        JSON.stringify(bestellung)
      );

    }


    /*
     * =====================================================
     * ARTIKEL SUCHEN
     * =====================================================
     */

    function artikelSuchen() {

      const suchwert = document
        .getElementById('suche')
        .value
        .trim();

      const ergebnis =
        document.getElementById('ergebnis');

      if (!suchwert) {

        ergebnis.innerHTML = '';
        return;

      }

      const treffer = artikelstamm.find(item =>
        item.artikelnummer === suchwert ||
        item.barcode === suchwert
      );


      if (treffer) {

        aktuellerArtikel = treffer;

        ergebnis.innerHTML =
          '<p><strong>Artikelnummer:</strong> ' +
          treffer.artikelnummer +
          '</p>' +

          '<p><strong>Bezeichnung:</strong> ' +
          treffer.bezeichnung +
          '</p>' +

          '<p>' +
          '<label>Menge: </label>' +

          '<input ' +
          'type="number" ' +
          'id="menge" ' +
          'value="1" ' +
          'min="1" ' +
          'style="width:60px;">' +

          '</p>' +

          '<button onclick="zurBestellung()">' +
          'Zur Bestellung' +
          '</button>';

        return;

      }


      aktuellerArtikel = null;
      unbekannterBarcode = suchwert;

      ergebnis.innerHTML =
        '<p><strong>Artikel nicht bekannt.</strong></p>' +

        '<p>Barcode: ' +
        unbekannterBarcode +
        '</p>' +

        '<button onclick="artikelAufnehmen()">' +
        'Artikel aufnehmen' +
        '</button>';

    }


    /*
     * =====================================================
     * ARTIKEL ZUR BESTELLUNG
     * =====================================================
     */

    function zurBestellung() {

      if (!aktuellerArtikel) {
        return;
      }

      const menge =
        parseInt(
          document.getElementById('menge').value,
          10
        );

      if (!menge || menge < 1) {

        alert('Bitte eine gültige Menge eingeben.');
        return;

      }

      const vorhanden = bestellung.find(item =>
        item.artikelnummer ===
        aktuellerArtikel.artikelnummer
      );


      if (vorhanden) {

        vorhanden.menge += menge;

      } else {

        bestellung.push({

          artikelnummer:
            aktuellerArtikel.artikelnummer,

          bezeichnung:
            aktuellerArtikel.bezeichnung,

          menge: menge

        });

      }


      bestellungSpeichern();
      bestellungAnzeigen();

      document.getElementById('suche').value = '';
      document.getElementById('ergebnis').innerHTML = '';
      document.getElementById('mailVorschau').innerHTML = '';

      aktuellerArtikel = null;

      document.getElementById('suche').focus();

    }


    /*
     * =====================================================
     * BESTELLLISTE
     * =====================================================
     */

    function bestellungAnzeigen() {

      const bereich =
        document.getElementById('bestellliste');

      if (bestellung.length === 0) {

        bereich.innerHTML =
          'Noch keine Artikel in der Bestellung.';

        return;

      }

      let html = '';

      bestellung.forEach((item, index) => {

        html +=
          '<div style="margin-bottom:15px;">' +

          '<strong>' +
          item.artikelnummer +
          '</strong> – ' +
          item.bezeichnung +

          '<br><br>' +

          'Menge: ' +

          '<input ' +
          'type="number" ' +
          'min="1" ' +
          'value="' +
          item.menge +
          '" ' +
          'style="width:60px;" ' +
          'onchange="mengeAendern(' +
          index +
          ', this.value)">' +

          ' ' +

          '<button onclick="positionLoeschen(' +
          index +
          ')">' +
          'Löschen' +
          '</button>' +

          '</div>';

      });

      bereich.innerHTML = html;

    }


    function mengeAendern(index, neueMenge) {

      const menge =
        parseInt(neueMenge, 10);

      if (!menge || menge < 1) {

        alert('Die Menge muss mindestens 1 sein.');

        bestellungAnzeigen();
        return;

      }

      bestellung[index].menge = menge;

      bestellungSpeichern();

      document.getElementById('mailVorschau').innerHTML = '';

    }


    function positionLoeschen(index) {

      bestellung.splice(index, 1);

      bestellungSpeichern();
      bestellungAnzeigen();

      document.getElementById('mailVorschau').innerHTML = '';

    }


    /*
     * =====================================================
     * BESTELLMAIL VORSCHAU
     * =====================================================
     */

    function bestellungVorbereiten() {

      const van = vanHolen();

      if (!van) {

        alert('Bitte zuerst VAN speichern.');

        document.getElementById('van').focus();

        return;

      }


      if (bestellung.length === 0) {

        alert('Die Bestellung ist leer.');

        return;

      }


      const betreff =
        'Bestellung ' + van;


      let mailtext =
        'Hallo zusammen,\n\n' +
        'bitte folgende Artikel für ' +
        van +
        ' bestellen:\n\n';


      bestellung.forEach(item => {

        mailtext +=
          item.menge +
          ' x ' +
          item.artikelnummer +
          ' – ' +
          item.bezeichnung +
          '\n';

      });


      mailtext +=
        '\nVielen Dank und viele Grüße\n' +
        'Lukas';


      const vorschau =
        document.getElementById('mailVorschau');


      vorschau.innerHTML =
        '<hr>' +

        '<h2>Mail-Vorschau</h2>' +

        '<p><strong>An:</strong> ' +
        TEST_EMPFAENGER +
        '</p>' +

        '<p><strong>Betreff:</strong> ' +
        betreff +
        '</p>' +

        '<p><strong>Text:</strong></p>' +

        '<pre style="white-space:pre-wrap;">' +
        mailtext +
        '</pre>';

    }


    /*
     * =====================================================
     * UNBEKANNTEN ARTIKEL AUFNEHMEN
     * =====================================================
     */

    function artikelAufnehmen() {

      const ergebnis =
        document.getElementById('ergebnis');

      ergebnis.innerHTML =
        '<h3>Neuen Artikel aufnehmen</h3>' +

        '<p>Barcode: ' +
        unbekannterBarcode +
        '</p>' +

        '<input ' +
        'type="text" ' +
        'id="neueArtikelnummer" ' +
        'placeholder="Artikelnummer" ' +
        'autocomplete="off">' +

        '<p>' +

        '<button onclick="artikelnummerPruefen()">' +
        'Weiter' +
        '</button>' +

        '</p>';

      document
        .getElementById('neueArtikelnummer')
        .focus();

    }


    function artikelnummerPruefen() {

      const artikelnummer = document
        .getElementById('neueArtikelnummer')
        .value
        .trim();

      if (!artikelnummer) {

        alert('Bitte Artikelnummer eingeben.');
        return;

      }


      const bekannterArtikel =
        artikelstamm.find(item =>
          item.artikelnummer === artikelnummer
        );


      if (bekannterArtikel) {

        const ergebnis =
          document.getElementById('ergebnis');

        ergebnis.innerHTML =
          '<h3>Artikel bereits bekannt:</h3>' +

          '<p>Artikelnummer: ' +
          bekannterArtikel.artikelnummer +
          '</p>' +

          '<p>Bezeichnung: ' +
          bekannterArtikel.bezeichnung +
          '</p>' +

          '<p>Neuer Barcode: ' +
          unbekannterBarcode +
          '</p>' +

          '<button onclick="barcodeVorschlagen(\'' +
          bekannterArtikel.artikelnummer +
          '\', \'' +
          encodeURIComponent(
            bekannterArtikel.bezeichnung
          ) +
          '\')">' +
          'Barcode vorschlagen' +
          '</button>';

        return;

      }


      const ergebnis =
        document.getElementById('ergebnis');

      ergebnis.innerHTML =
        '<h3>Neuer Artikel</h3>' +

        '<p>Artikelnummer: ' +
        artikelnummer +
        '</p>' +

        '<p>Barcode: ' +
        unbekannterBarcode +
        '</p>' +

        '<input ' +
        'type="text" ' +
        'id="neueBezeichnung" ' +
        'placeholder="Bezeichnung" ' +
        'autocomplete="off">' +

        '<p>' +

        '<button onclick="neuenArtikelVorschlagen(\'' +
        artikelnummer +
        '\')">' +
        'Artikel vorschlagen' +
        '</button>' +

        '</p>';

    }


    async function barcodeVorschlagen(
      artikelnummer,
      bezeichnungEncoded
    ) {

      const bezeichnung =
        decodeURIComponent(bezeichnungEncoded);

      await vorschlagSenden(
        artikelnummer,
        bezeichnung,
        unbekannterBarcode
      );

    }


    async function neuenArtikelVorschlagen(
      artikelnummer
    ) {

      const bezeichnung = document
        .getElementById('neueBezeichnung')
        .value
        .trim();

      if (!bezeichnung) {

        alert('Bitte Bezeichnung eingeben.');
        return;

      }

      await vorschlagSenden(
        artikelnummer,
        bezeichnung,
        unbekannterBarcode
      );

    }


    async function vorschlagSenden(
      artikelnummer,
      bezeichnung,
      barcode
    ) {

      const ergebnis =
        document.getElementById('ergebnis');

      const van = vanHolen();


      if (!van) {

        alert(
          'Bitte zuerst oben deine VAN-Nummer speichern.'
        );

        document.getElementById('van').focus();

        return;

      }


      try {

        const response = await fetch(API_URL, {

          method: 'POST',

          body: JSON.stringify({

            van: van,
            artikelnummer: artikelnummer,
            bezeichnung: bezeichnung,
            barcode: barcode

          })

        });


        if (!response.ok) {

          throw new Error(
            'HTTP-Fehler: ' +
            response.status
          );

        }


        const antwort =
          await response.json();


        if (antwort.bereitsVorhanden) {

          ergebnis.innerHTML =
            '<p><strong>' +
            'Vorschlag bereits vorhanden.' +
            '</strong></p>';

        } else {

          ergebnis.innerHTML =
            '<p><strong>' +
            'Vorschlag gespeichert.' +
            '</strong></p>';

        }


      } catch (fehler) {

        ergebnis.innerHTML =
          '<p><strong>Fehler beim Speichern:</strong> ' +
          fehler.message +
          '</p>';

      }

    }


    /*
     * =====================================================
     * ENTER / SCANNER
     * =====================================================
     */

    document
      .getElementById('suche')
      .addEventListener(
        'keydown',
        function(event) {

          if (event.key === 'Enter') {

            event.preventDefault();

            artikelSuchen();

          }

        }
      );


    /*
     * =====================================================
     * START
     * =====================================================
     */

    vanLaden();
    bestellungLaden();
    artikelLaden();

  </script>

</body>
</html>
