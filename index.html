<!DOCTYPE html>
<!-- GitHub Pages Deploy Neustart -->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stryker Bestellen Smart</title>
<style>
:root{--y:#ffc928;--bg:#101719;--panel:#192326;--line:#344145;--text:#f7f7f7;--muted:#aeb9bc}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
#startAnsicht{width:min(100%,460px);min-height:100vh;margin:auto;padding:24px 18px 18px;display:flex;flex-direction:column}
.startHeader{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px}.brandStryker{font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1}.brandSmart{margin-top:7px;font-size:22px;font-weight:750;color:var(--y)}
.iconButton{width:46px;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);font-size:22px}
.vanCard{width:100%;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);padding:15px 16px;display:flex;align-items:center;gap:13px;text-align:left;margin-bottom:18px}.vanIcon{font-size:27px}.vanLabel{display:block;font-size:12px;color:var(--muted)}#startVan{display:block;margin-top:2px;font-size:18px;font-weight:700}.vanArrow{margin-left:auto;font-size:24px;color:var(--muted)}
.scanMain{width:100%;min-height:78px;border:0;border-radius:17px;background:var(--y);color:#101010;font-size:20px;font-weight:800;margin-bottom:12px}
.startActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.secondaryAction,.historyAction{min-height:62px;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);font-size:15px;font-weight:650}.historyAction{width:100%;min-height:48px;color:var(--muted);margin-bottom:18px}
.orderStartButton{width:100%;min-height:62px;margin-top:auto;border:0;border-radius:16px;background:#f5f6f6;color:#101415;font-size:17px;font-weight:800}
#appFooter{margin-top:14px!important;text-align:center;font-size:11px!important;color:#7f8c90!important;line-height:1.45}
@media(min-width:700px){#startAnsicht{min-height:760px;padding-top:38px}}

  .eingabeOverlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:var(--bg);
    overflow:auto;
    padding:18px;
  }
  .eingabeOverlayInnen{
    width:min(100%,460px);
    margin:0 auto;
  }
  .overlayZurueck{
    min-height:44px;
    border:1px solid var(--line);
    border-radius:13px;
    background:var(--panel);
    color:var(--text);
    padding:0 16px;
    font-size:15px;
    font-weight:650;
    margin-bottom:16px;
  }
  .eingabeOverlay input{
    width:100%;
    min-height:50px;
    border:1px solid var(--line);
    border-radius:13px;
    padding:0 14px;
    font-size:18px;
    margin-bottom:10px;
  }
  .eingabeOverlay button:not(.overlayZurueck){
    min-height:48px;
    border-radius:13px;
    padding:0 16px;
  }


.uiIcon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex:0 0 auto}
.scanMain .uiIcon{width:30px;height:30px;margin-right:12px}
.iconButton{display:flex;align-items:center;justify-content:center}
.secondaryAction{display:flex;align-items:center;justify-content:center;gap:9px}
.settingsHistory{width:100%;min-height:52px;margin-top:12px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--text);font-size:15px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:9px}

</style>
</head>

<body>
<div id="startAnsicht">
  <div class="startHeader"><div><div class="brandStryker">stryker</div><div class="brandSmart">Bestellen Smart</div></div><button class="iconButton" type="button" onclick="einstellungenOeffnen()"><svg class="uiIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 8.97 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.52-1.03H3v-4h.08A1.7 1.7 0 0 0 4.6 8.94a1.7 1.7 0 0 0-.34-1.88L4.2 7l2.83-2.83.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 10 3.05V3h4v.08a1.7 1.7 0 0 0 1.03 1.52 1.7 1.7 0 0 0 1.88-.34l.06-.06L19.8 7l-.06.06a1.7 1.7 0 0 0-.34 1.88A1.7 1.7 0 0 0 20.92 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/></svg></button></div>

  <button id="cameraBtn" class="scanMain" type="button" onclick="kameraOeffnen()"><svg class="uiIcon scanIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M7 10v4M10 9v6M13 9v6M16 10v4"/></svg><span>Artikel scannen</span></button>
  <div class="startActions"><button type="button" class="secondaryAction" onclick="favoritenOeffnen()"><svg class="uiIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.78 5.63 6.22.9-4.5 4.39 1.06 6.2L12 17.2l-5.56 2.92 1.06-6.2L3 9.53l6.22-.9L12 3Z"/></svg><span>Favoriten</span></button><button id="manuellBtn" type="button" class="secondaryAction" onclick="manuelleEingabeOeffnen()"><svg class="uiIcon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M6 9h1M10 9h1M14 9h1M18 9h.01M6 12h1M10 12h1M14 12h1M18 12h.01M7 15h10"/></svg><span>Manuell eingeben</span></button></div>
  <div id="manuelleEingabe" class="eingabeOverlay">
    <div class="eingabeOverlayInnen">
      <button type="button" class="overlayZurueck" onclick="manuelleEingabeSchliessen()">← Schließen</button>
      <h2>Artikelnummer eingeben</h2>
      <input type="text" id="suche" placeholder="Artikelnummer" autocomplete="off" inputmode="numeric">
      <button type="button" onclick="artikelSuchen()">Suchen</button>
      <div id="ergebnis"></div>
    </div>
  </div>
  <div id="cameraBox" class="eingabeOverlay">
    <div class="eingabeOverlayInnen">
      <button type="button" class="overlayZurueck" onclick="kameraSchliessen()">← Schließen</button>
      <div style="position:relative;width:100%;height:205px;background:#000;overflow:hidden">
        <video id="video" playsinline muted style="width:100%;height:205px;object-fit:cover;background:#000"></video>
        <div id="scanRahmen" style="position:absolute;left:8%;right:8%;top:31%;height:38%;border:3px solid #ffd400;box-sizing:border-box;pointer-events:none"></div>
      </div>
      <div id="scanStatus" style="min-height:22px;margin-top:6px"></div>
      <button id="scanTrigger" type="button">📷 SCANNEN</button>
      <button id="torchBtn" type="button" onclick="lichtUmschalten()">💡 LICHT</button>
      <div id="scanErgebnis"></div>
    </div>
  </div>
  <div id="bestellungButtonBereich"><button type="button" id="bestellungBtn" class="orderStartButton" onclick="bestellungOeffnen()">Zur Bestellung → (0)</button></div>
  <div id="verlaufButtonBereich" style="display:none"></div><div id="einstellungenButtonBereich" style="display:none"></div>
  <div id="appFooter"><div><span id="footerVan">VAN nicht gesetzt</span> • Version 0.8</div><div id="status">Artikelstamm wird geladen...</div></div>
</div>
<div id="bestellungAnsicht" style="display:none"><p><button type="button" onclick="bestellungSchliessen()">← Zurück</button></p><h2>Bestellung</h2><div id="bestellliste">Noch keine Artikel in der Bestellung.</div><p><button onclick="bestellungInOutlook()">In Outlook öffnen</button> <button onclick="neueBestellung()">Neue Bestellung</button></p></div>
<div id="favoritenAnsicht" style="display:none;">
  <button type="button" onclick="favoritenSchliessen()">← Zurück</button>
  <h2>⭐ Favoriten</h2>
  <div id="favoritenListe"></div>
  <button type="button" onclick="favoritenZurBestellung()">Zur Bestellung hinzufügen</button>
</div>

<div id="verlaufAnsicht" style="display:none;">
  <p>
    <button type="button" onclick="verlaufSchliessen()">
      ← Zurück zur Bestellung
    </button>
  </p>

  <h2>Bestellverlauf</h2>

  <div id="verlauf">
    Noch keine Bestellung an Outlook übergeben.
  </div>
</div>


  <div id="einstellungenAnsicht" style="display:none;">
  <p>
    <button type="button" onclick="einstellungenSchliessen()">
      ← Zurück
    </button>
  </p>

  <h2>Einstellungen</h2>

  <p>
    <strong>VAN</strong><br>
    <input
      type="text"
      id="einstellungenVan"
      placeholder="z.B. VAN16"
      autocomplete="off"
      autocapitalize="characters"
    >
  </p>

  <p>
    <label>
      <input type="checkbox" id="ccAktiv">
      CC verwenden
    </label>
  </p>

  <p>
    <strong>CC E-Mail</strong><br>
    <input
      type="email"
      id="ccEmail"
      placeholder="name@firma.de"
      autocomplete="email"
    >
  </p>

  <p>
    <button type="button" onclick="einstellungenSpeichern()">
      Speichern
    </button>
  </p>
</div>



<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.18.6/umd/index.min.js"></script>
  
  <script>

    const API_URL =
      'https://script.google.com/macros/s/AKfycbx9oXcfdmay6RtCI22A18t2TNGghcccYvSlBJ5pu0_E5E2jfSknkWMBqQAUFEhkm3Pv-w/exec';

    const BESTELLUNG_SPEICHER =
      'strykerBestellenSmart_bestellung';

    const VAN_SPEICHER =
      'strykerBestellenSmart_van';
    
    const VERLAUF_SPEICHER =
  'strykerBestellenSmart_verlauf';

    const FAVORITEN_SPEICHER =
      'strykerBestellenSmart_favoriten';

    const CC_AKTIV_SPEICHER =
      'strykerBestellenSmart_cc_aktiv';

    const CC_EMAIL_SPEICHER =
      'strykerBestellenSmart_cc_email';

    const TEST_EMPFAENGER =
      'procareservicegsa@stryker.com';

    let artikelstamm = [];
    let unbekannterBarcode = '';
    let aktuellerArtikel = null;
    let bestellung = [];


    /*
     * =====================================================
     * VAN
     * =====================================================
     */

    function vanLaden() {
      let van = localStorage.getItem(VAN_SPEICHER) || '';

      if (van) {
        van = van.toUpperCase();
        localStorage.setItem(VAN_SPEICHER, van);
      }

      const footerVan = document.getElementById('footerVan');

      if (footerVan) {
        footerVan.textContent = van || 'VAN nicht gesetzt';
        const startVan=document.getElementById('startVan');
        if(startVan) startVan.textContent=van || 'VAN nicht gesetzt';
      }
    }


    function vanHolen() {

      return (localStorage.getItem(VAN_SPEICHER) || '').toUpperCase();

    }


    function einstellungenOeffnen() {
      document.getElementById('einstellungenAnsicht').style.display = 'block';
      document.getElementById('einstellungenButtonBereich').style.display = 'none';

      Array.from(document.body.children).forEach(function(element) {
        if (
          element.id !== 'einstellungenAnsicht' &&
          element.id !== 'einstellungenButtonBereich' &&
          element.tagName !== 'SCRIPT'
        ) {
          element.dataset.vorEinstellungen = element.style.display || '';
          element.style.display = 'none';
        }
      });

      document.getElementById('einstellungenVan').value = vanHolen();
      document.getElementById('ccAktiv').checked =
        localStorage.getItem(CC_AKTIV_SPEICHER) === 'true';
      document.getElementById('ccEmail').value =
        localStorage.getItem(CC_EMAIL_SPEICHER) || '';

      window.scrollTo(0, 0);
    }


    function einstellungenSchliessen() {
      Array.from(document.body.children).forEach(function(element) {
        if (
          element.id !== 'einstellungenAnsicht' &&
          element.id !== 'einstellungenButtonBereich' &&
          element.tagName !== 'SCRIPT'
        ) {
          element.style.display = element.dataset.vorEinstellungen || '';
          delete element.dataset.vorEinstellungen;
        }
      });

      document.getElementById('einstellungenAnsicht').style.display = 'none';
      document.getElementById('einstellungenButtonBereich').style.display = 'block';
      window.scrollTo(0, 0);
    }


    function einstellungenSpeichern() {
      const van = document
        .getElementById('einstellungenVan')
        .value
        .trim()
        .toUpperCase();

      const ccAktiv = document.getElementById('ccAktiv').checked;
      const ccEmail = document.getElementById('ccEmail').value.trim();

      if (!van) {
        alert('Bitte VAN eingeben.');
        return;
      }

      if (ccAktiv && !ccEmail) {
        alert('Bitte eine CC E-Mail-Adresse eingeben.');
        return;
      }

      if (ccAktiv && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ccEmail)) {
        alert('Bitte eine gültige CC E-Mail-Adresse eingeben.');
        return;
      }

      localStorage.setItem(VAN_SPEICHER, van);
      localStorage.setItem(CC_AKTIV_SPEICHER, String(ccAktiv));
      localStorage.setItem(CC_EMAIL_SPEICHER, ccEmail);

      vanLaden();
      document.getElementById('einstellungenVan').value = van;

      alert('Einstellungen gespeichert.');
    }


    function ccHolen() {
      if (localStorage.getItem(CC_AKTIV_SPEICHER) !== 'true') {
        return '';
      }

      return localStorage.getItem(CC_EMAIL_SPEICHER) || '';
    }


    /*
     * =====================================================
     * ARTIKELSTAMM
     * =====================================================
     */

    async function artikelLaden() {

      try {

        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error('HTTP-Fehler: ' + response.status);
        }

        artikelstamm = await response.json();

        document.getElementById('status').textContent =
          artikelstamm.length + ' Datensätze geladen.';

      } catch (fehler) {

        document.getElementById('status').textContent =
          'Fehler beim Laden: ' + fehler.message;

      }

    }


    /*
     * =====================================================
     * BESTELLUNG LADEN / SPEICHERN
     * =====================================================
     */

    function bestellungLaden() {

      try {

        const gespeichert =
          localStorage.getItem(BESTELLUNG_SPEICHER);

        if (gespeichert) {

          const daten = JSON.parse(gespeichert);

          if (Array.isArray(daten)) {
            bestellung = daten;
          }

        }

      } catch (fehler) {

        bestellung = [];

      }

      bestellungAnzeigen();

    }


    function bestellungSpeichern() {

      localStorage.setItem(
        BESTELLUNG_SPEICHER,
        JSON.stringify(bestellung)
      );

    }


    function manuelleEingabeOeffnen() {
      const bereich = document.getElementById('manuelleEingabe');
      const suche = document.getElementById('suche');
      const ergebnis = document.getElementById('ergebnis');
      const innen = bereich.querySelector('.eingabeOverlayInnen');

      if (ergebnis && innen) innen.appendChild(ergebnis);
      bereich.style.display = 'block';
      suche.value = '';
      ergebnis.innerHTML = '';
      suche.focus();
    }

    function manuelleEingabeSchliessen() {
      const bereich = document.getElementById('manuelleEingabe');
      bereich.style.display = 'none';
      document.getElementById('ergebnis').innerHTML = '';
      document.getElementById('suche').value = '';
      aktuellerArtikel = null;
    }


    /*
     * =====================================================
     * ARTIKEL SUCHEN
     * =====================================================
     */

    function artikelSuchen() {

      const suchwert = document
        .getElementById('suche')
        .value
        .trim();

      const ergebnis =
        document.getElementById('ergebnis');

      if (!suchwert) {

        ergebnis.innerHTML = '';
        return;

      }

      const treffer = artikelstamm.find(item =>
        item.artikelnummer === suchwert ||
        item.barcode === suchwert
      );


      if (treffer) {

        aktuellerArtikel = treffer;

        ergebnis.innerHTML =
          '<p><strong>Artikelnummer:</strong> ' +
          treffer.artikelnummer +
          '</p>' +

          '<p><strong>Bezeichnung:</strong> ' +
          treffer.bezeichnung +
          '</p>' +

          '<p>' +
          '<label>Menge: </label>' +

          '<input ' +
          'type="number" ' +
          'id="menge" ' +
          'value="1" ' +
          'min="1" ' +
          'style="width:60px;">' +

          '</p>' +

          '<button onclick="zurBestellung()">' +
          'Zur Bestellung' +
          '</button>' +

          '<span id="favoritStern" style="margin-left:8px;"></span>';

        favoritSternAktualisieren();
        return;

      }


      aktuellerArtikel = null;
      unbekannterBarcode = suchwert;

      ergebnis.innerHTML =
        '<p><strong>Artikel nicht bekannt.</strong></p>' +

        '<p>Barcode: ' +
        unbekannterBarcode +
        '</p>' +

        '<button onclick="artikelAufnehmen()">' +
        'Artikel aufnehmen' +
        '</button>';

    }


    /*
     * =====================================================
     * ARTIKEL ZUR BESTELLUNG
     * =====================================================
     */

    function zurBestellung() {

      if (!aktuellerArtikel) {
        return;
      }

      const menge =
        parseInt(
          document.getElementById('menge').value,
          10
        );

      if (!menge || menge < 1) {

        alert('Bitte eine gültige Menge eingeben.');
        return;

      }

      const vorhanden = bestellung.find(item =>
        item.artikelnummer ===
        aktuellerArtikel.artikelnummer
      );


      if (vorhanden) {

        vorhanden.menge += menge;

      } else {

        bestellung.push({

          artikelnummer:
            aktuellerArtikel.artikelnummer,

          bezeichnung:
            aktuellerArtikel.bezeichnung,

          menge: menge

        });

      }


      bestellungSpeichern();
      bestellungAnzeigen();

      document.getElementById('suche').value = '';
      document.getElementById('ergebnis').innerHTML = '';

      aktuellerArtikel = null;

    if (istMobil()) {
  document.getElementById('suche').blur();
} else {
  document.getElementById('suche').focus();
}

    }


    function bestellungOeffnen() {
      document.getElementById('bestellungAnsicht').style.display = 'block';
      document.getElementById('bestellungButtonBereich').style.display = 'none';

      Array.from(document.body.children).forEach(function(element) {
        if (
          element.id !== 'bestellungAnsicht' &&
          element.id !== 'bestellungButtonBereich' &&
          element.tagName !== 'SCRIPT'
        ) {
          element.dataset.vorBestellung = element.style.display || '';
          element.style.display = 'none';
        }
      });

      bestellungAnzeigen();
      window.scrollTo(0, 0);
    }


    function bestellungSchliessen() {
      Array.from(document.body.children).forEach(function(element) {
        if (
          element.id !== 'bestellungAnsicht' &&
          element.id !== 'bestellungButtonBereich' &&
          element.tagName !== 'SCRIPT'
        ) {
          element.style.display = element.dataset.vorBestellung || '';
          delete element.dataset.vorBestellung;
        }
      });

      document.getElementById('bestellungAnsicht').style.display = 'none';
      document.getElementById('bestellungButtonBereich').style.display = 'block';
      bestellungButtonAktualisieren();
      window.scrollTo(0, 0);
    }


    function bestellungButtonAktualisieren() {
      const button = document.getElementById('bestellungBtn');

      if (button) {
        button.textContent = 'Zur Bestellung → (' + bestellung.length + ')';
      }
    }


    /*
     * =====================================================
     * BESTELLLISTE
     * =====================================================
     */

    function bestellungAnzeigen() {

      bestellungButtonAktualisieren();

      const bereich =
        document.getElementById('bestellliste');

      if (bestellung.length === 0) {

        bereich.innerHTML =
          'Noch keine Artikel in der Bestellung.';

        return;

      }

      let html = '';

      bestellung.forEach((item, index) => {

        html +=
          '<div style="margin-bottom:15px;">' +

          '<strong>' +
          item.artikelnummer +
          '</strong> – ' +
          item.bezeichnung +

          '<br><br>' +

          'Menge: ' +

          '<input ' +
          'type="number" ' +
          'min="1" ' +
          'value="' +
          item.menge +
          '" ' +
          'style="width:60px;" ' +
          'onchange="mengeAendern(' +
          index +
          ', this.value)">' +

          ' ' +

          '<button onclick="positionLoeschen(' +
          index +
          ')">' +
          'Löschen' +
          '</button>' +

          '</div>';

      });

      bereich.innerHTML = html;

    }


    function mengeAendern(index, neueMenge) {

      const menge =
        parseInt(neueMenge, 10);

      if (!menge || menge < 1) {

        alert('Die Menge muss mindestens 1 sein.');

        bestellungAnzeigen();
        return;

      }

      bestellung[index].menge = menge;

      bestellungSpeichern();


    }


    function positionLoeschen(index) {

      bestellung.splice(index, 1);

      bestellungSpeichern();
      bestellungAnzeigen();


    }


    /*
 * =====================================================
 * NEUE BESTELLUNG
 * =====================================================
 */

function neueBestellung() {

  if (bestellung.length === 0) {
    alert('Die Bestellung ist bereits leer.');
    return;
  }

  const bestaetigt = confirm(
    'Aktuelle Bestellung wirklich leeren?'
  );

  if (!bestaetigt) {
    return;
  }

  bestellung = [];

  bestellungSpeichern();
  bestellungAnzeigen();


  document.getElementById('suche').value = '';
  document.getElementById('ergebnis').innerHTML = '';
  document.getElementById('manuelleEingabe').style.display = 'none';

  aktuellerArtikel = null;



}
    
function verlaufOeffnen() {
  document.getElementById('verlaufAnsicht').style.display = 'block';
  document.getElementById('verlaufButtonBereich').style.display = 'none';

  Array.from(document.body.children).forEach(function(element) {
    if (
      element.id !== 'verlaufAnsicht' &&
      element.id !== 'verlaufButtonBereich' &&
      element.tagName !== 'SCRIPT'
    ) {
      element.dataset.vorVerlauf = element.style.display || '';
      element.style.display = 'none';
    }
  });

  verlaufAnzeigen();
  window.scrollTo(0, 0);
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function favoritenLaden() {
  try {
    const daten = JSON.parse(localStorage.getItem(FAVORITEN_SPEICHER) || '[]');
    return Array.isArray(daten) ? daten : [];
  } catch (e) { return []; }
}
function favoritenSpeichern(daten) {
  localStorage.setItem(FAVORITEN_SPEICHER, JSON.stringify(daten));
}
function istFavorit(artikelnummer) {
  return favoritenLaden().some(f => String(f.artikelnummer) === String(artikelnummer));
}
function favoritSternAktualisieren() {
  const el = document.getElementById('favoritStern');
  if (!el || !aktuellerArtikel) return;
  el.innerHTML =
    '<button type="button" onclick="favoritUmschalten()" style="font-size:22px;padding:2px 8px;" title="Favorit">' +
    (istFavorit(aktuellerArtikel.artikelnummer) ? '⭐' : '☆') +
    '</button>';
}
function favoritUmschalten() {
  if (!aktuellerArtikel) return;
  let liste = favoritenLaden();
  const index = liste.findIndex(f => String(f.artikelnummer) === String(aktuellerArtikel.artikelnummer));
  if (index >= 0) {
    liste.splice(index, 1);
  } else {
    liste.push({
      artikelnummer: String(aktuellerArtikel.artikelnummer),
      bezeichnung: String(aktuellerArtikel.bezeichnung || '')
    });
  }
  favoritenSpeichern(liste);
  favoritSternAktualisieren();
}

function favoritMengeAendern(index, delta) {
  const feld = document.getElementById('favMenge' + index);

function favoritEntfernen(index) {

  if (index < 0 || index >= liste.length) return;

  favoritenRendern();

function favoritenZurBestellung() {

  favoritenSchliessen();
}

let kameraStream = null;
let barcodeReader = null;
let scanBereit = false;
let scanTimeout = null;
let audioContext = null;

function scanStatusSetzen(text) {
  const status = document.getElementById('scanStatus');
  if (status) status.textContent = text || '';
}

function scanTimeoutStoppen() {
  if (scanTimeout) {
    clearTimeout(scanTimeout);
    scanTimeout = null;
  }
}

function scanBestaetigen() {
  try {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioContext.state === 'suspended') {
      audioContext.resume();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
    gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.12, audioContext.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.11);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.12);
  } catch (fehler) {
    console.log('Bestätigungston nicht verfügbar:', fehler);
  }

  if (navigator.vibrate) {
    navigator.vibrate(70);
  }
}

async function kameraOeffnen() {
  try {
    if (typeof ZXing === 'undefined') {
      alert('Barcode-Scanner konnte nicht geladen werden.');
      return;
    }

    const cameraBox = document.getElementById('cameraBox');
    const scanErgebnis = document.getElementById('scanErgebnis');
    const ergebnis = document.getElementById('ergebnis');
    if (ergebnis && scanErgebnis) scanErgebnis.appendChild(ergebnis);

    cameraBox.style.display = 'block';
    scanStatusSetzen('Barcode in den gelben Rahmen halten.');

    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.ITF
    ]);

    // Schwieriger gedruckte, blasse oder leicht beschädigte Barcodes intensiver prüfen.
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

    barcodeReader = new ZXing.BrowserBarcodeReader(250, hints);
    scanBereit = false;

    const video = document.getElementById('video');
    const scanTrigger = document.getElementById('scanTrigger');

    scanTrigger.disabled = false;
    scanTrigger.textContent = '📷 SCANNEN';

    scanTrigger.onclick = function () {
      scanTimeoutStoppen();

      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContext.state === 'suspended') {
          audioContext.resume();
        }
      } catch (fehler) {}

      scanBereit = true;
      scanTrigger.disabled = true;
      scanTrigger.textContent = 'SCANNEN…';
      scanStatusSetzen('Suche Barcode…');

      scanTimeout = setTimeout(function () {
        if (!scanBereit) return;

        scanBereit = false;
        scanTrigger.disabled = false;
        scanTrigger.textContent = '📷 SCANNEN';
        scanStatusSetzen('Code nicht lesbar – bitte näher herangehen, Licht einschalten oder erneut scannen.');
      }, 8000);
    };

    barcodeReader.decodeFromVideoDevice(
      undefined,
      video,
      function (ergebnis, fehler) {
        if (!ergebnis || !scanBereit) return;

        const barcode = String(ergebnis.text || '').trim();
        if (!barcode) return;
        if (!/^[A-Za-z0-9-]{3,32}$/.test(barcode)) return;

        scanBereit = false;
        scanTimeoutStoppen();

        document.getElementById('suche').value = barcode;
        scanTrigger.disabled = false;
        scanTrigger.textContent = '📷 SCANNEN';

        scanStatusSetzen('✓ Barcode erkannt');
        scanBestaetigen();
        artikelSuchen();
      }
    );

  } catch (fehler) {
    console.error(fehler);
    alert('Kamera konnte nicht geöffnet werden.');
    kameraSchliessen();
  }
}

async function kameraSchliessen() {
  scanBereit = false;
  scanTimeoutStoppen();
  scanStatusSetzen('');

  if (barcodeReader) {
    try { barcodeReader.reset(); } catch (fehler) {}
    barcodeReader = null;
  }

  const video = document.getElementById('video');
  if (video && video.srcObject) {
    video.srcObject.getTracks().forEach(function (track) {
      track.stop();
    });
    video.srcObject = null;
  }

  kameraStream = null;
  document.getElementById('cameraBox').style.display = 'none';

  const scanTrigger = document.getElementById('scanTrigger');
  scanTrigger.disabled = false;
  scanTrigger.textContent = '📷 SCANNEN';

  if (!istMobil() && document.getElementById('manuelleEingabe').style.display !== 'none') {
    document.getElementById('suche').focus();
  }
}
async function lichtUmschalten() {
  try {
    const video = document.getElementById('video');

    if (!video.srcObject) {
      alert('Kamera ist nicht aktiv.');
      return;
    }

    const track = video.srcObject.getVideoTracks()[0];
    const caps = track.getCapabilities();

    if (!caps.torch) {
      alert('Licht ist auf diesem Gerät nicht verfügbar.');
      return;
    }

    const settings = track.getSettings();
    const lichtAn = !settings.torch;

    await track.applyConstraints({
      advanced: [{ torch: lichtAn }]
    });

    document.getElementById('torchBtn').textContent =
      lichtAn ? '💡 LICHT AUS' : '💡 LICHT';
      
  } catch (fehler) {
    console.error(fehler);
    alert('Licht konnte nicht geschaltet werden.');
  }

 }

function istMobil() {
  return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
}
