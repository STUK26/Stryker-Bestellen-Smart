<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stryker Bestellen Smart</title>
</head>

<body>

  <h1>Stryker Bestellen Smart</h1>


  <hr>

<button id="cameraBtn" onclick="kameraOeffnen()">
  📷 Barcode scannen
</button>

<button id="manuellBtn" type="button" onclick="manuelleEingabeOeffnen()">
  ⌨️ Artikelnummer eingeben
</button>

<div id="manuelleEingabe" style="display:none; margin-top:10px;">
  <input
    type="text"
    id="suche"
    placeholder="Artikelnummer"
    autocomplete="off"
    inputmode="numeric"
  >

  <button type="button" onclick="artikelSuchen()">Suchen</button>
</div>

  <div id="cameraBox" style="display:none; margin-top:10px;">
  <div style="position:relative; width:100%; height:205px; background:#000; overflow:hidden;">
    <video id="video" playsinline muted
           style="width:100%; height:205px; object-fit:cover; background:#000;"></video>

    <div id="scanRahmen"
         style="position:absolute; left:8%; right:8%; top:31%; height:38%;
                border:3px solid #ffd400; box-sizing:border-box; pointer-events:none;">
    </div>
  </div>

  <div id="scanStatus" style="min-height:22px; margin-top:6px;"></div>

  <button id="scanTrigger" type="button">📷 SCANNEN</button>

  <button id="torchBtn" type="button" onclick="lichtUmschalten()">💡 LICHT</button>

  <button type="button" onclick="kameraSchliessen()">Schließen</button>
</div>

  <div id="ergebnis"></div>

  <hr>

  <div id="bestellungButtonBereich">
  <button type="button" id="bestellungBtn" onclick="bestellungOeffnen()">
    🛒 Bestellung (0)
  </button>
</div>

<div id="bestellungAnsicht" style="display:none;">
  <p>
    <button type="button" onclick="bestellungSchliessen()">
      ← Zurück
    </button>
  </p>

  <h2>Bestellung</h2>

  <div id="bestellliste">
    Noch keine Artikel in der Bestellung.
  </div>

  <p>
    <button onclick="bestellungInOutlook()">
      In Outlook öffnen
    </button>

    <button onclick="neueBestellung()">
      Neue Bestellung
    </button>
  </p>
</div>

<hr>

<div id="verlaufButtonBereich">
  <button type="button" onclick="favoritenOeffnen()">⭐ Favoriten</button>

<button type="button" onclick="verlaufOeffnen()">
    📋 Verlauf
  </button>
</div>

<div id="einstellungenButtonBereich" style="margin-top:10px;">
  <button type="button" onclick="einstellungenOeffnen()">
    ⚙️ Einstellungen
  </button>
</div>

<div id="favoritenAnsicht" style="display:none;">
  <button type="button" onclick="favoritenSchliessen()">← Zurück</button>
  <h2>⭐ Favoriten</h2>
  <div id="favoritenListe"></div>
  <button type="button" onclick="favoritenZurBestellung()">Zur Bestellung hinzufügen</button>
</div>

<div id="verlaufAnsicht" style="display:none;">
  <p>
    <button type="button" onclick="verlaufSchliessen()">
      ← Zurück zur Bestellung
    </button>
  </p>

  <h2>Bestellverlauf</h2>

  <div id="verlauf">
    Noch keine Bestellung an Outlook übergeben.
  </div>
</div>


  <div id="einstellungenAnsicht" style="display:none;">
  <p>
    <button type="button" onclick="einstellungenSchliessen()">
      ← Zurück
    </button>
  </p>

  <h2>Einstellungen</h2>

  <p>
    <strong>VAN</strong><br>
    <input
      type="text"
      id="einstellungenVan"
      placeholder="z.B. VAN16"
      autocomplete="off"
      autocapitalize="characters"
    >
  </p>

  <p>
    <label>
      <input type="checkbox" id="ccAktiv">
      CC verwenden
    </label>
  </p>

  <p>
    <strong>CC E-Mail</strong><br>
    <input
      type="email"
      id="ccEmail"
      placeholder="name@firma.de"
      autocomplete="email"
    >
  </p>

  <p>
    <button type="button" onclick="einstellungenSpeichern()">
      Speichern
    </button>
  </p>
</div>

<div id="appFooter" style="margin-top:24px; text-align:center; font-size:12px; color:#666;">
    <div><span id="footerVan">VAN nicht gesetzt</span> • Version 0.7</div>
    <div id="status">Artikelstamm wird geladen...</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.18.6/umd/index.min.js"></script>
  
  <script>

    const API_URL =
      'https://script.google.com/macros/s/AKfycbx9oXcfdmay6RtCI22A18t2TNGghcccYvSlBJ5pu0_E5E2jfSknkWMBqQAUFEhkm3Pv-w/exec';

    const BESTELLUNG_SPEICHER =
      'strykerBestellenSmart_bestellung';

    const VAN_SPEICHER =
      'strykerBestellenSmart_van';
    
    const VERLAUF_SPEICHER =
  'strykerBestellenSmart_verlauf';

    const FAVORITEN_SPEICHER =
      'strykerBestellenSmart_favoriten';

    const CC_AKTIV_SPEICHER =
      'strykerBestellenSmart_cc_aktiv';

    const CC_EMAIL_SPEICHER =
      'strykerBestellenSmart_cc_email';

    const TEST_EMPFAENGER =
      'procareservicegsa@stryker.com';

    let artikelstamm = [];
    let unbekannterBarcode = '';
    let aktuellerArtikel = null;
    let bestellung = [];


    /*
     * =====================================================
     * VAN
     * =====================================================
     */

    function vanLaden() {
      let van = localStorage.getItem(VAN_SPEICHER) || '';

      if (van) {
        van = van.toUpperCase();
        localStorage.setItem(VAN_SPEICHER, van);
      }

      const footerVan = document.getElementById('footerVan');

      if (footerVan) {
        footerVan.textContent = van || 'VAN nicht gesetzt';
      }
    }


    function vanHolen() {

      return (localStorage.getItem(VAN_SPEICHER) || '').toUpperCase();

    }


    function einstellungenOeffnen() {
      document.getElementById('einstellungenAnsicht').style.display = 'block';
      document.getElementById('einstellungenButtonBereich').style.display = 'none';

      Array.from(document.body.children).forEach(function(element) {
        if (
          element.id !== 'einstellungenAnsicht' &&
          element.id !== 'einstellungenButtonBereich' &&
          element.tagName !== 'SCRIPT'
        ) {
          element.dataset.vorEinstellungen = element.style.display || '';
          element.style.display = 'none';
        }
      });

      document.getElementById('einstellungenVan').value = vanHolen();
      document.getElementById('ccAktiv').checked =
        localStorage.getItem(CC_AKTIV_SPEICHER) === 'true';
      document.getElementById('ccEmail').value =
        localStorage.getItem(CC_EMAIL_SPEICHER) || '';

      window.scrollTo(0, 0);
    }


    function einstellungenSchliessen() {
      Array.from(document.body.children).forEach(function(element) {
        if (
          element.id !== 'einstellungenAnsicht' &&
          element.id !== 'einstellungenButtonBereich' &&
          element.tagName !== 'SCRIPT'
        ) {
          element.style.display = element.dataset.vorEinstellungen || '';
          delete element.dataset.vorEinstellungen;
        }
      });

      document.getElementById('einstellungenAnsicht').style.display = 'none';
      document.getElementById('einstellungenButtonBereich').style.display = 'block';
      window.scrollTo(0, 0);
    }


    function einstellungenSpeichern() {
      const van = document
        .getElementById('einstellungenVan')
        .value
        .trim()
        .toUpperCase();

      const ccAktiv = document.getElementById('ccAktiv').checked;
      const ccEmail = document.getElementById('ccEmail').value.trim();

      if (!van) {
        alert('Bitte VAN eingeben.');
        return;
      }

      if (ccAktiv && !ccEmail) {
        alert('Bitte eine CC E-Mail-Adresse eingeben.');
        return;
      }

      if (ccAktiv && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ccEmail)) {
        alert('Bitte eine gültige CC E-Mail-Adresse eingeben.');
        return;
      }

      localStorage.setItem(VAN_SPEICHER, van);
      localStorage.setItem(CC_AKTIV_SPEICHER, String(ccAktiv));
      localStorage.setItem(CC_EMAIL_SPEICHER, ccEmail);

      vanLaden();
      document.getElementById('einstellungenVan').value = van;

      alert('Einstellungen gespeichert.');
    }


    function ccHolen() {
      if (localStorage.getItem(CC_AKTIV_SPEICHER) !== 'true') {
        return '';
      }

      return localStorage.getItem(CC_EMAIL_SPEICHER) || '';
    }


    /*
     * =====================================================
     * ARTIKELSTAMM
     * =====================================================
     */

    async function artikelLaden() {

      try {

        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error('HTTP-Fehler: ' + response.status);
        }

        artikelstamm = await response.json();

        document.getElementById('status').textContent =
          artikelstamm.length + ' Datensätze geladen.';

      } catch (fehler) {

        document.getElementById('status').textContent =
          'Fehler beim Laden: ' + fehler.message;

      }

    }


    /*
     * =====================================================
     * BESTELLUNG LADEN / SPEICHERN
     * =====================================================
     */

    function bestellungLaden() {

      try {

        const gespeichert =
          localStorage.getItem(BESTELLUNG_SPEICHER);

        if (gespeichert) {

          const daten = JSON.parse(gespeichert);

          if (Array.isArray(daten)) {
            bestellung = daten;
          }

        }

      } catch (fehler) {

        bestellung = [];

      }

      bestellungAnzeigen();

    }


    function bestellungSpeichern() {

      localStorage.setItem(
        BESTELLUNG_SPEICHER,
        JSON.stringify(bestellung)
      );

    }


    function manuelleEingabeOeffnen() {
      const bereich = document.getElementById('manuelleEingabe');
      const suche = document.getElementById('suche');

      bereich.style.display = 'block';
      suche.value = '';
      suche.focus();
    }


    /*
     * =====================================================
     * ARTIKEL SUCHEN
     * =====================================================
     */

    function artikelSuchen() {

      const suchwert = document
        .getElementById('suche')
        .value
        .trim();

      const ergebnis =
        document.getElementById('ergebnis');

      if (!suchwert) {

        ergebnis.innerHTML = '';
        return;

      }

      const treffer = artikelstamm.find(item =>
        item.artikelnummer === suchwert ||
        item.barcode === suchwert
      );


      if (treffer) {

        aktuellerArtikel = treffer;

        ergebnis.innerHTML =
          '<p><strong>Artikelnummer:</strong> ' +
          treffer.artikelnummer +
          '</p>' +

          '<p><strong>Bezeichnung:</strong> ' +
          treffer.bezeichnung +
          '</p>' +

          '<p>' +
          '<label>Menge: </label>' +

          '<input ' +
          'type="number" ' +
          'id="menge" ' +
          'value="1" ' +
          'min="1" ' +
          'style="width:60px;">' +

          '</p>' +

          '<button onclick="zurBestellung()">' +
          'Zur Bestellung' +
          '</button>' +

          '<span id="favoritStern" style="margin-left:8px;"></span>';

        favoritSternAktualisieren();
        return;

      }


      aktuellerArtikel = null;
      unbekannterBarcode = suchwert;

      ergebnis.innerHTML =
        '<p><strong>Artikel nicht bekannt.</strong></p>' +

        '<p>Barcode: ' +
        unbekannterBarcode +
        '</p>' +

        '<button onclick="artikelAufnehmen()">' +
        'Artikel aufnehmen' +
        '</button>';

    }


    /*
     * =====================================================
     * ARTIKEL ZUR BESTELLUNG
     * =====================================================
     */

    function zurBestellung() {

      if (!aktuellerArtikel) {
        return;
      }

      const menge =
        parseInt(
          document.getElementById('menge').value,
          10
        );

      if (!menge || menge < 1) {

        alert('Bitte eine gültige Menge eingeben.');
        return;

      }

      const vorhanden = bestellung.find(item =>
        item.artikelnummer ===
        aktuellerArtikel.artikelnummer
      );


      if (vorhanden) {

        vorhanden.menge += menge;

      } else {

        bestellung.push({

          artikelnummer:
            aktuellerArtikel.artikelnummer,

          bezeichnung:
            aktuellerArtikel.bezeichnung,

          menge: menge

        });

      }


      bestellungSpeichern();
      bestellungAnzeigen();

      document.getElementById('suche').value = '';
      document.getElementById('ergebnis').innerHTML = '';

      aktuellerArtikel = null;

    if (istMobil()) {
  document.getElementById('suche').blur();
} else {
  document.getElementById('suche').focus();
}

    }


    function bestellungOeffnen() {
      document.getElementById('bestellungAnsicht').style.display = 'block';
      document.getElementById('bestellungButtonBereich').style.display = 'none';

      Array.from(document.body.children).forEach(function(element) {
        if (
          element.id !== 'bestellungAnsicht' &&
          element.id !== 'bestellungButtonBereich' &&
          element.tagName !== 'SCRIPT'
        ) {
          element.dataset.vorBestellung = element.style.display || '';
          element.style.display = 'none';
        }
      });

      bestellungAnzeigen();
      window.scrollTo(0, 0);
    }


    function bestellungSchliessen() {
      Array.from(document.body.children).forEach(function(element) {
        if (
          element.id !== 'bestellungAnsicht' &&
          element.id !== 'bestellungButtonBereich' &&
          element.tagName !== 'SCRIPT'
        ) {
          element.style.display = element.dataset.vorBestellung || '';
          delete element.dataset.vorBestellung;
        }
      });

      document.getElementById('bestellungAnsicht').style.display = 'none';
      document.getElementById('bestellungButtonBereich').style.display = 'block';
      bestellungButtonAktualisieren();
      window.scrollTo(0, 0);
    }


    function bestellungButtonAktualisieren() {
      const button = document.getElementById('bestellungBtn');

      if (button) {
        button.textContent = '🛒 Bestellung (' + bestellung.length + ')';
      }
    }


    /*
     * =====================================================
     * BESTELLLISTE
     * =====================================================
     */

    function bestellungAnzeigen() {

      bestellungButtonAktualisieren();

      const bereich =
        document.getElementById('bestellliste');

      if (bestellung.length === 0) {

        bereich.innerHTML =
          'Noch keine Artikel in der Bestellung.';

        return;

      }

      let html = '';

      bestellung.forEach((item, index) => {

        html +=
          '<div style="margin-bottom:15px;">' +

          '<strong>' +
          item.artikelnummer +
          '</strong> – ' +
          item.bezeichnung +

          '<br><br>' +

          'Menge: ' +

          '<input ' +
          'type="number" ' +
          'min="1" ' +
          'value="' +
          item.menge +
          '" ' +
          'style="width:60px;" ' +
          'onchange="mengeAendern(' +
          index +
          ', this.value)">' +

          ' ' +

          '<button onclick="positionLoeschen(' +
          index +
          ')">' +
          'Löschen' +
          '</button>' +

          '</div>';

      });

      bereich.innerHTML = html;

    }


    function mengeAendern(index, neueMenge) {

      const menge =
        parseInt(neueMenge, 10);

      if (!menge || menge < 1) {

        alert('Die Menge muss mindestens 1 sein.');

        bestellungAnzeigen();
        return;

      }

      bestellung[index].menge = menge;

      bestellungSpeichern();


    }


    function positionLoeschen(index) {

      bestellung.splice(index, 1);

      bestellungSpeichern();
      bestellungAnzeigen();


    }


    /*
 * =====================================================
 * NEUE BESTELLUNG
 * =====================================================
 */

function neueBestellung() {

  if (bestellung.length === 0) {
    alert('Die Bestellung ist bereits leer.');
    return;
  }

  const bestaetigt = confirm(
    'Aktuelle Bestellung wirklich leeren?'
  );

  if (!bestaetigt) {
    return;
  }

  bestellung = [];

  bestellungSpeichern();
  bestellungAnzeigen();


  document.getElementById('suche').value = '';
  document.getElementById('ergebnis').innerHTML = '';
  document.getElementById('manuelleEingabe').style.display = 'none';

  aktuellerArtikel = null;



}
    
function verlaufOeffnen() {
  document.getElementById('verlaufAnsicht').style.display = 'block';
  document.getElementById('verlaufButtonBereich').style.display = 'none';

  Array.from(document.body.children).forEach(function(element) {
    if (
      element.id !== 'verlaufAnsicht' &&
      element.id !== 'verlaufButtonBereich' &&
      element.tagName !== 'SCRIPT'
    ) {
      element.dataset.vorVerlauf = element.style.display || '';
      element.style.display = 'none';
    }
  });

  verlaufAnzeigen();
  window.scrollTo(0, 0);
}

function verlaufSchliessen() {
  Array.from(document.body.children).forEach(function(element) {
    if (
      element.id !== 'verlaufAnsicht' &&
      element.id !== 'verlaufButtonBereich' &&
      element.tagName !== 'SCRIPT'
    ) {
      element.style.display = element.dataset.vorVerlauf || '';
      delete element.dataset.vorVerlauf;
    }
  });

  document.getElementById('verlaufAnsicht').style.display = 'none';
  document.getElementById('verlaufButtonBereich').style.display = 'block';
  window.scrollTo(0, 0);
}

/*
 * =====================================================
 * BESTELLUNG IM VERLAUF SPEICHERN
 * =====================================================
 */

function bestellungImVerlaufSpeichern() {

  const van = vanHolen();

  let verlauf = [];

  try {

    const gespeichert =
      localStorage.getItem(VERLAUF_SPEICHER);

    if (gespeichert) {
      verlauf = JSON.parse(gespeichert);
    }

    if (!Array.isArray(verlauf)) {
      verlauf = [];
    }

  } catch (fehler) {

    verlauf = [];

  }

verlauf.unshift({
  datum: new Date().toISOString(),
  van: van,
  status: 'An Outlook übergeben',
  artikel: JSON.parse(JSON.stringify(bestellung))
});

verlauf = verlauf.slice(0, 50);
  
  localStorage.setItem(
    VERLAUF_SPEICHER,
    JSON.stringify(verlauf)
  );

}
   /*
 * =====================================================
 * VERLAUF ANZEIGEN
 * =====================================================
 */

function verlaufAnzeigen() {

  const bereich =
    document.getElementById('verlauf');

  let verlauf = [];

  try {

    const gespeichert =
      localStorage.getItem(VERLAUF_SPEICHER);

    if (gespeichert) {
      verlauf = JSON.parse(gespeichert);
    }

    if (!Array.isArray(verlauf)) {
      verlauf = [];
    }

  } catch (fehler) {

    verlauf = [];

  }

  if (verlauf.length === 0) {

    bereich.innerHTML =
      'Noch keine Bestellung an Outlook übergeben.';

    return;

  }

  let html = '';

  verlauf.forEach(eintrag => {

    const datum =
      new Date(eintrag.datum).toLocaleString('de-DE');

    html +=
      '<div style="margin-bottom:20px;">' +

      '<strong>' +
      datum +
      ' – ' +
      eintrag.van +
      '</strong>' +

      '<br>' +
      eintrag.status +
      '<br><br>';

    eintrag.artikel.forEach(item => {

      html +=
        item.menge +
        ' x ' +
        item.artikelnummer +
        ' – ' +
        item.bezeichnung +
        '<br>';

    });

    html += '</div>';

  });

  bereich.innerHTML = html;

} 
/*
 * =====================================================
 * BESTELLUNG IN OUTLOOK ÖFFNEN
 * =====================================================
 */

function bestellungInOutlook() {

  const van = vanHolen();

  if (!van) {
    alert('VAN ist noch nicht eingestellt.');
    return;
  }

  if (bestellung.length === 0) {
    alert('Die Bestellung ist leer.');
    return;
  }

  const betreff =
    'Bestellung ' + van;

  let mailtext =
    'Hallo zusammen,\n\n' +
    'bitte folgende Artikel für ' +
    van +
    ' bestellen:\n\n';

  bestellung.forEach(item => {

    mailtext +=
      item.menge +
      ' x ' +
      item.artikelnummer +
      ' – ' +
      item.bezeichnung +
      '\n';

  });

  mailtext +=
    '\nVielen Dank';

  const cc = ccHolen();

  const mailto =
    'mailto:' +
    TEST_EMPFAENGER +
    '?subject=' +
    encodeURIComponent(betreff) +
    (cc ? '&cc=' + encodeURIComponent(cc) : '') +
    '&body=' +
    encodeURIComponent(mailtext);

  const outlookMobile =
    'ms-outlook://compose?to=' +
    encodeURIComponent(TEST_EMPFAENGER) +
    (cc ? '&cc=' + encodeURIComponent(cc) : '') +
    '&subject=' +
    encodeURIComponent(betreff) +
    '&body=' +
    encodeURIComponent(mailtext);

  bestellungImVerlaufSpeichern();
  verlaufAnzeigen();

  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    window.location.href = outlookMobile;
  } else {
    window.location.href = mailto;
  }

}
    /*
     * =====================================================
     * UNBEKANNTEN ARTIKEL AUFNEHMEN
     * =====================================================
     */

    function artikelAufnehmen() {

      const ergebnis =
        document.getElementById('ergebnis');

      ergebnis.innerHTML =
        '<h3>Neuen Artikel aufnehmen</h3>' +

        '<p>Barcode: ' +
        unbekannterBarcode +
        '</p>' +

        '<input ' +
        'type="text" ' +
        'id="neueArtikelnummer" ' +
        'placeholder="Artikelnummer" ' +
        'autocomplete="off">' +

        '<p>' +

        '<button onclick="artikelnummerPruefen()">' +
        'Weiter' +
        '</button>' +

        '</p>';

      document
        .getElementById('neueArtikelnummer')
        .focus();

    }


    function artikelnummerPruefen() {

      const artikelnummer = document
        .getElementById('neueArtikelnummer')
        .value
        .trim();

      if (!artikelnummer) {

        alert('Bitte Artikelnummer eingeben.');
        return;

      }


      const bekannterArtikel =
        artikelstamm.find(item =>
          item.artikelnummer === artikelnummer
        );


      if (bekannterArtikel) {

        const ergebnis =
          document.getElementById('ergebnis');

        ergebnis.innerHTML =
          '<h3>Artikel bereits bekannt:</h3>' +

          '<p>Artikelnummer: ' +
          bekannterArtikel.artikelnummer +
          '</p>' +

          '<p>Bezeichnung: ' +
          bekannterArtikel.bezeichnung +
          '</p>' +

          '<p>Neuer Barcode: ' +
          unbekannterBarcode +
          '</p>' +

          '<button onclick="barcodeVorschlagen(\'' +
          bekannterArtikel.artikelnummer +
          '\', \'' +
          encodeURIComponent(
            bekannterArtikel.bezeichnung
          ) +
          '\')">' +
          'Barcode vorschlagen' +
          '</button>';

        return;

      }


      const ergebnis =
        document.getElementById('ergebnis');

      ergebnis.innerHTML =
        '<h3>Neuer Artikel</h3>' +

        '<p>Artikelnummer: ' +
        artikelnummer +
        '</p>' +

        '<p>Barcode: ' +
        unbekannterBarcode +
        '</p>' +

        '<input ' +
        'type="text" ' +
        'id="neueBezeichnung" ' +
        'placeholder="Bezeichnung" ' +
        'autocomplete="off">' +

        '<p>' +

        '<button onclick="neuenArtikelVorschlagen(\'' +
        artikelnummer +
        '\')">' +
        'Artikel vorschlagen' +
        '</button>' +

        '</p>';

    }


    async function barcodeVorschlagen(
      artikelnummer,
      bezeichnungEncoded
    ) {

      const bezeichnung =
        decodeURIComponent(bezeichnungEncoded);

      await vorschlagSenden(
        artikelnummer,
        bezeichnung,
        unbekannterBarcode
      );

    }


    async function neuenArtikelVorschlagen(
      artikelnummer
    ) {

      const bezeichnung = document
        .getElementById('neueBezeichnung')
        .value
        .trim();

      if (!bezeichnung) {

        alert('Bitte Bezeichnung eingeben.');
        return;

      }

      await vorschlagSenden(
        artikelnummer,
        bezeichnung,
        unbekannterBarcode
      );

    }


    async function vorschlagSenden(
      artikelnummer,
      bezeichnung,
      barcode
    ) {

      const ergebnis =
        document.getElementById('ergebnis');

      const van = vanHolen();


      if (!van) {

        alert(
          'VAN ist noch nicht eingestellt.'
        );

        return;

      }


      try {

        const response = await fetch(API_URL, {

          method: 'POST',

          body: JSON.stringify({

            van: van,
            artikelnummer: artikelnummer,
            bezeichnung: bezeichnung,
            barcode: barcode

          })

        });


        if (!response.ok) {

          throw new Error(
            'HTTP-Fehler: ' +
            response.status
          );

        }


        const antwort =
          await response.json();


        if (antwort.bereitsVorhanden) {

          ergebnis.innerHTML =
            '<p><strong>' +
            'Vorschlag bereits vorhanden.' +
            '</strong></p>';

        } else {

          ergebnis.innerHTML =
            '<p><strong>' +
            'Vorschlag gespeichert.' +
            '</strong></p>';

        }


      } catch (fehler) {

        ergebnis.innerHTML =
          '<p><strong>Fehler beim Speichern:</strong> ' +
          fehler.message +
          '</p>';

      }

    }


    /*
     * =====================================================
     * ENTER / SCANNER
     * =====================================================
     */

    document
      .getElementById('suche')
      .addEventListener(
        'keydown',
        function(event) {

          if (event.key === 'Enter') {

            event.preventDefault();

            artikelSuchen();

          }

        }
      );


    /*
     * =====================================================
     * START
     * =====================================================
     */


function escapeHtml(text) {
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function favoritenLaden() {
  try {
    const daten = JSON.parse(localStorage.getItem(FAVORITEN_SPEICHER) || '[]');
    return Array.isArray(daten) ? daten : [];
  } catch (e) { return []; }
}
function favoritenSpeichern(daten) {
  localStorage.setItem(FAVORITEN_SPEICHER, JSON.stringify(daten));
}
function istFavorit(artikelnummer) {
  return favoritenLaden().some(f => String(f.artikelnummer) === String(artikelnummer));
}
function favoritSternAktualisieren() {
  const el = document.getElementById('favoritStern');
  if (!el || !aktuellerArtikel) return;
  el.innerHTML =
    '<button type="button" onclick="favoritUmschalten()" style="font-size:22px;padding:2px 8px;" title="Favorit">' +
    (istFavorit(aktuellerArtikel.artikelnummer) ? '⭐' : '☆') +
    '</button>';
}
function favoritUmschalten() {
  if (!aktuellerArtikel) return;
  let liste = favoritenLaden();
  const index = liste.findIndex(f => String(f.artikelnummer) === String(aktuellerArtikel.artikelnummer));
  if (index >= 0) {
    liste.splice(index, 1);
  } else {
    liste.push({
      artikelnummer: String(aktuellerArtikel.artikelnummer),
      bezeichnung: String(aktuellerArtikel.bezeichnung || '')
    });
  }
  favoritenSpeichern(liste);
  favoritSternAktualisieren();
}
function favoritenOeffnen() {
  Array.from(document.body.children).forEach(function(element) {
    if (element.id !== 'favoritenAnsicht' && element.tagName !== 'SCRIPT') {
      element.dataset.vorFavoriten = element.style.display || '';
      element.style.display = 'none';
    }
  });
  document.getElementById('favoritenAnsicht').style.display = 'block';
  favoritenRendern();
  window.scrollTo(0, 0);
}
function favoritenSchliessen() {
  Array.from(document.body.children).forEach(function(element) {
    if (element.id !== 'favoritenAnsicht' && element.tagName !== 'SCRIPT') {
      element.style.display = element.dataset.vorFavoriten || '';
      delete element.dataset.vorFavoriten;
    }
  });
  document.getElementById('favoritenAnsicht').style.display = 'none';
  window.scrollTo(0, 0);
}
function favoritenRendern() {
  const ziel = document.getElementById('favoritenListe');
  const liste = favoritenLaden();

  if (!liste.length) {
    ziel.innerHTML = '<p>Noch keine Favoriten gespeichert.</p>';
    return;
  }

  ziel.innerHTML = liste.map((f, i) =>
    '<div style="border-bottom:1px solid #ccc;padding:10px 0;">' +
      '<label>' +
        '<input type="checkbox" class="favCheck" data-index="' + i + '"> ' +
        '<strong>' + escapeHtml(String(f.artikelnummer)) + '</strong><br>' +
        escapeHtml(String(f.bezeichnung || '')) +
      '</label>' +
      '<div style="margin-top:6px;">' +
        'Menge: ' +
        '<button type="button" onclick="favoritMengeAendern(' + i + ',-1)">−</button> ' +
        '<input id="favMenge' + i + '" type="number" min="1" value="1" style="width:55px;text-align:center;"> ' +
        '<button type="button" onclick="favoritMengeAendern(' + i + ',1)">+</button> ' +
        '<button type="button" onclick="favoritEntfernen(' + i + ')">⭐ entfernen</button>' +
      '</div>' +
    '</div>'
  ).join('');
}
function favoritMengeAendern(index, delta) {
  const feld = document.getElementById('favMenge' + index);
  if (!feld) return;
  feld.value = Math.max(1, (parseInt(feld.value, 10) || 1) + delta);
}
function favoritEntfernen(index) {
  let liste = favoritenLaden();
  if (index < 0 || index >= liste.length) return;
  liste.splice(index, 1);
  favoritenSpeichern(liste);
  favoritenRendern();
}
function favoritenZurBestellung() {
  const liste = favoritenLaden();
  const auswahl = document.querySelectorAll('.favCheck:checked');

  if (!auswahl.length) {
    alert('Bitte mindestens einen Favoriten auswählen.');
    return;
  }

  auswahl.forEach(check => {
    const index = Number(check.dataset.index);
    const favorit = liste[index];
    if (!favorit) return;

    const feld = document.getElementById('favMenge' + index);
    const menge = Math.max(1, parseInt(feld.value, 10) || 1);
    const vorhanden = bestellung.find(item =>
      String(item.artikelnummer) === String(favorit.artikelnummer)
    );

    if (vorhanden) {
      vorhanden.menge += menge;
    } else {
      bestellung.push({
        artikelnummer: favorit.artikelnummer,
        bezeichnung: favorit.bezeichnung,
        menge: menge
      });
    }
  });

  bestellungSpeichern();
  bestellungAnzeigen();
  favoritenSchliessen();
}

let kameraStream = null;
let barcodeReader = null;
let scanBereit = false;
let scanTimeout = null;
let audioContext = null;

function scanStatusSetzen(text) {
  const status = document.getElementById('scanStatus');
  if (status) status.textContent = text || '';
}

function scanTimeoutStoppen() {
  if (scanTimeout) {
    clearTimeout(scanTimeout);
    scanTimeout = null;
  }
}

function scanBestaetigen() {
  try {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioContext.state === 'suspended') {
      audioContext.resume();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
    gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.12, audioContext.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.11);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.12);
  } catch (fehler) {
    console.log('Bestätigungston nicht verfügbar:', fehler);
  }

  if (navigator.vibrate) {
    navigator.vibrate(70);
  }
}

async function kameraOeffnen() {
  try {
    if (typeof ZXing === 'undefined') {
      alert('Barcode-Scanner konnte nicht geladen werden.');
      return;
    }

    document.getElementById('cameraBox').style.display = 'block';
    scanStatusSetzen('Barcode in den gelben Rahmen halten.');

    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.ITF
    ]);

    // Schwieriger gedruckte, blasse oder leicht beschädigte Barcodes intensiver prüfen.
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

    barcodeReader = new ZXing.BrowserBarcodeReader(250, hints);
    scanBereit = false;

    const video = document.getElementById('video');
    const scanTrigger = document.getElementById('scanTrigger');

    scanTrigger.disabled = false;
    scanTrigger.textContent = '📷 SCANNEN';

    scanTrigger.onclick = function () {
      scanTimeoutStoppen();

      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContext.state === 'suspended') {
          audioContext.resume();
        }
      } catch (fehler) {}

      scanBereit = true;
      scanTrigger.disabled = true;
      scanTrigger.textContent = 'SCANNEN…';
      scanStatusSetzen('Suche Barcode…');

      scanTimeout = setTimeout(function () {
        if (!scanBereit) return;

        scanBereit = false;
        scanTrigger.disabled = false;
        scanTrigger.textContent = '📷 SCANNEN';
        scanStatusSetzen('Code nicht lesbar – bitte näher herangehen, Licht einschalten oder erneut scannen.');
      }, 8000);
    };

    barcodeReader.decodeFromVideoDevice(
      undefined,
      video,
      function (ergebnis, fehler) {
        if (!ergebnis || !scanBereit) return;

        const barcode = String(ergebnis.text || '').trim();
        if (!barcode) return;
        if (!/^[A-Za-z0-9-]{3,32}$/.test(barcode)) return;

        scanBereit = false;
        scanTimeoutStoppen();

        document.getElementById('suche').value = barcode;
        scanTrigger.disabled = false;
        scanTrigger.textContent = '📷 SCANNEN';

        scanStatusSetzen('✓ Barcode erkannt');
        scanBestaetigen();
        artikelSuchen();
      }
    );

  } catch (fehler) {
    console.error(fehler);
    alert('Kamera konnte nicht geöffnet werden.');
    kameraSchliessen();
  }
}

async function kameraSchliessen() {
  scanBereit = false;
  scanTimeoutStoppen();
  scanStatusSetzen('');

  if (barcodeReader) {
    try { barcodeReader.reset(); } catch (fehler) {}
    barcodeReader = null;
  }

  const video = document.getElementById('video');
  if (video && video.srcObject) {
    video.srcObject.getTracks().forEach(function (track) {
      track.stop();
    });
    video.srcObject = null;
  }

  kameraStream = null;
  document.getElementById('cameraBox').style.display = 'none';

  const scanTrigger = document.getElementById('scanTrigger');
  scanTrigger.disabled = false;
  scanTrigger.textContent = '📷 SCANNEN';

  if (!istMobil() && document.getElementById('manuelleEingabe').style.display !== 'none') {
    document.getElementById('suche').focus();
  }
}
async function lichtUmschalten() {
  try {
    const video = document.getElementById('video');

    if (!video.srcObject) {
      alert('Kamera ist nicht aktiv.');
      return;
    }

    const track = video.srcObject.getVideoTracks()[0];
    const caps = track.getCapabilities();

    if (!caps.torch) {
      alert('Licht ist auf diesem Gerät nicht verfügbar.');
      return;
    }

    const settings = track.getSettings();
    const lichtAn = !settings.torch;

    await track.applyConstraints({
      advanced: [{ torch: lichtAn }]
    });

    document.getElementById('torchBtn').textContent =
      lichtAn ? '💡 LICHT AUS' : '💡 LICHT';
      
  } catch (fehler) {
    console.error(fehler);
    alert('Licht konnte nicht geschaltet werden.');
  }

 }

function istMobil() {
  return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
}
