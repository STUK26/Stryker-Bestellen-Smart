<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stryker Bestellen Smart</title>
</head>

<body>

  <h1>Stryker Bestellen Smart</h1>

  <p id="status">Artikelstamm wird geladen...</p>

  <input
    type="text"
    id="suche"
    placeholder="Artikelnummer oder Barcode"
    autocomplete="off"
  >

  <button onclick="artikelSuchen()">Suchen</button>

  <div id="ergebnis"></div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbx9oXcfdmay6RtCI22A18t2TNGghcccYvSlBJ5pu0_E5E2jfSknkWMBqQAUFEhkm3Pv-w/exec';

    let artikelstamm = [];
    let unbekannterBarcode = '';

    async function artikelLaden() {
      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error('HTTP-Fehler: ' + response.status);
        }

        artikelstamm = await response.json();

        document.getElementById('status').textContent =
          artikelstamm.length + ' Datensätze geladen.';

      } catch (fehler) {
        document.getElementById('status').textContent =
          'Fehler beim Laden: ' + fehler.message;
      }
    }

    function artikelSuchen() {
      const suchwert = document
        .getElementById('suche')
        .value
        .trim();

      const ergebnis = document.getElementById('ergebnis');

      if (!suchwert) {
        ergebnis.textContent = 'Bitte Artikelnummer oder Barcode eingeben.';
        return;
      }

      const treffer = artikelstamm.find(item =>
        item.artikelnummer === suchwert ||
        item.barcode === suchwert
      );

      if (treffer) {
        unbekannterBarcode = '';

        ergebnis.innerHTML =
          '<p><strong>Artikelnummer:</strong> ' +
          treffer.artikelnummer +
          '</p>' +
          '<p><strong>Bezeichnung:</strong> ' +
          treffer.bezeichnung +
          '</p>';

      } else {
        unbekannterBarcode = suchwert;

        ergebnis.innerHTML =
          '<p><strong>Artikel nicht bekannt.</strong></p>' +
          '<p>Barcode: ' + unbekannterBarcode + '</p>' +
          '<button onclick="vorschlagStarten()">Artikel aufnehmen</button>';
      }
    }

    function vorschlagStarten() {
      document.getElementById('ergebnis').innerHTML =
        '<p><strong>Neuen Artikel aufnehmen</strong></p>' +
        '<p>Barcode: ' + unbekannterBarcode + '</p>' +
        '<input type="text" id="neueArtikelnummer" placeholder="Artikelnummer">' +
        '<br><br>' +
        '<button onclick="artikelnummerPruefen()">Weiter</button>';
    }

    function artikelnummerPruefen() {
      const artikelnummer = document
        .getElementById('neueArtikelnummer')
        .value
        .trim();

      if (!artikelnummer) {
        alert('Bitte Artikelnummer eingeben.');
        return;
      }

      const vorhandenerArtikel = artikelstamm.find(item =>
        item.artikelnummer === artikelnummer
      );

      if (vorhandenerArtikel) {
        document.getElementById('ergebnis').innerHTML =
          '<p><strong>Artikel bereits bekannt:</strong></p>' +
          '<p>Artikelnummer: ' + vorhandenerArtikel.artikelnummer + '</p>' +
          '<p>Bezeichnung: ' + vorhandenerArtikel.bezeichnung + '</p>' +
          '<p>Neuer Barcode: ' + unbekannterBarcode + '</p>' +
          '<button onclick="vorschlagSenden(\'' +
          vorhandenerArtikel.artikelnummer +
          '\', \'' +
          vorhandenerArtikel.bezeichnung.replace(/'/g, "\\'") +
          '\')">Barcode vorschlagen</button>';

      } else {
        document.getElementById('ergebnis').innerHTML =
          '<p><strong>Neue Artikelnummer</strong></p>' +
          '<p>Artikelnummer: ' + artikelnummer + '</p>' +
          '<input type="text" id="neueBezeichnung" placeholder="Bezeichnung">' +
          '<br><br>' +
          '<button onclick="neuenArtikelSenden(\'' +
          artikelnummer +
          '\')">Vorschlag senden</button>';
      }
    }

    function neuenArtikelSenden(artikelnummer) {
      const bezeichnung = document
        .getElementById('neueBezeichnung')
        .value
        .trim();

      if (!bezeichnung) {
        alert('Bitte Bezeichnung eingeben.');
        return;
      }

      vorschlagSenden(artikelnummer, bezeichnung);
    }

    async function vorschlagSenden(artikelnummer, bezeichnung) {
      const daten = {
        van: 'VAN16',
        artikelnummer: artikelnummer,
        bezeichnung: bezeichnung,
        barcode: unbekannterBarcode
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(daten)
        });

        const antwort = await response.json();

        if (antwort.erfolg) {
          document.getElementById('ergebnis').innerHTML =
            '<p><strong>Vorschlag gespeichert.</strong></p>';
        } else {
          throw new Error('Vorschlag konnte nicht gespeichert werden.');
        }

      } catch (fehler) {
        document.getElementById('ergebnis').textContent =
          'Fehler: ' + fehler.message;
      }
    }

    document
      .getElementById('suche')
      .addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
          artikelSuchen();
        }
      });

    artikelLaden();
  </script>

</body>
</html>
